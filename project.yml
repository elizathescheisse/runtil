name: Runtil

options:
  bundleIdPrefix: com.ergilp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  RuntilCore:
    path: RuntilCore

targets:

  Runtil:
    type: application
    platform: iOS
    sources:
      - path: Runtil
    dependencies:
      - package: RuntilCore
      - target: RuntilWatch
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ergilp.runtil
        PRODUCT_NAME: runtil
        INFOPLIST_FILE: Runtil/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Runtil/Runtil.entitlements

  RuntilWatch:
    type: application
    platform: watchOS
    sources:
      - path: RuntilWatch
    dependencies:
      - package: RuntilCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ergilp.runtil.watchkitapp
        PRODUCT_NAME: runtil
        INFOPLIST_FILE: RuntilWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: RuntilWatch/RuntilWatch.entitlements
        SKIP_INSTALL: NO
