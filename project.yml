name: Runtil

options:
  bundleIdPrefix: com.ergilp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"

# Signing lives in Local.xcconfig, which is gitignored — so a team ID never lands in the
# public repo, and `make project` can't wipe it the way it wipes settings made in Xcode's UI.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # Bumped so a fresh install can never be mistaken for a cached copy of an
    # earlier build — watchOS matched the old bundle and failed verification.
    CURRENT_PROJECT_VERSION: "21"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  RuntilCore:
    path: RuntilCore

# Declared explicitly so they're shared files in the project rather than per-user schemes
# Xcode autocreates in gitignored xcuserdata — those drift, and a missing scheme means a
# target you simply can't select and run.
schemes:
  Runtil:
    build:
      targets:
        Runtil: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  RuntilWatchWidgets:
    build:
      targets:
        RuntilWatchWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  RuntilWatch:
    build:
      targets:
        RuntilWatch: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:

  Runtil:
    type: application
    platform: iOS
    sources:
      - path: Runtil
    dependencies:
      - package: RuntilCore
      - target: RuntilWatch
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ergilp.runtil
        PRODUCT_NAME: runtil
        INFOPLIST_FILE: Runtil/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. This is an app you strap to your arm; shipping it for iPad would
        # mean supporting landscape on a device nobody runs with.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Runtil/Runtil.entitlements

  RuntilWatch:
    type: application
    platform: watchOS
    sources:
      - path: RuntilWatch
    dependencies:
      - package: RuntilCore
      - target: RuntilWatchWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ergilp.runtil.watchkitapp
        PRODUCT_NAME: runtil
        INFOPLIST_FILE: RuntilWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: RuntilWatch/RuntilWatch.entitlements
        SKIP_INSTALL: NO

  RuntilWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: RuntilWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ergilp.runtil.watchkitapp.widgets
        PRODUCT_NAME: RuntilWatchWidgets
        INFOPLIST_FILE: RuntilWatchWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
